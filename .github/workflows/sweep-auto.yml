# Scheduled autonomous sweep: discovery, content-hash dedupe, triage, artifact.
#
# Daily at 09:00 UTC on the default branch; the runner's own cadence gate
# (default 1 day) decides whether a scheduled tick actually sweeps, so
# same-day re-ticks exit quietly. Manual dispatch stays available with an
# optional force flag.
#
# Posture (decided 2026-11-01): the operator explicitly accepted running
# this schedule - all portals including linkedin-search - from their own
# fork CI runners daily. Note the linkedin-search skill is personal-use
# only per its own ToS warning; that acceptance covers this fork's runners.
# Schedules only fire on the default branch; a fork arms this by merging it.
# Actions are pinned to commit SHAs; the token is read-only.

name: Scheduled sweep

on:
  schedule:
    - cron: "0 9 * * *" # Daily 09:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the cadence window has not elapsed"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install freehire CLI dependencies
        run: bun install
        working-directory: .agents/skills/freehire-search/cli
      - name: Install LinkedIn CLI dependencies
        run: bun install
        working-directory: .agents/skills/linkedin-search/cli
      - name: Run scheduled sweep
        run: python3 tools/sweep-runner.py ${{ inputs.force == 'true' && '--force' || '' }}
      - name: Upload sweep artifact
        if: success() && hashFiles('reports/sweeps/sweep-*.md') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sweep-artifact
          path: reports/sweeps/
